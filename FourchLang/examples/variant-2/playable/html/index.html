<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>FourchLang – Playable</title>

    <link rel="stylesheet" href="assets/style.css" />
</head>

<body>
<h1>FourchLang – Jeu jouable</h1>

<div id="controls">
    <button id="btn-random">IA Random</button>
    <button id="btn-greedy">IA Greedy</button>
    <button id="btn-minimax">IA Minimax</button>

    <button id="btn-reset">Reset</button>

    <span style="margin-left:12px;">Auto:</span>
    <select id="auto-ai">
        <option value="random">Random</option>
        <option value="greedy" selected>Greedy</option>
        <option value="minimax">Minimax</option>
    </select>

    <button id="btn-auto-start">Start Auto</button>
    <button id="btn-auto-stop" disabled>Stop Auto</button>
    <label style="margin-left:12px;">
        Vitesse:
        <input id="speed" type="range" min="200" max="1000" step="50" value="1000" />
        <span id="speed-label">1.0s</span>
    </label>
</div>

<div id="hud">Score: <span id="score">0</span></div>

<canvas id="board" width="600" height="600"></canvas>

<div id="gameover" class="hidden">
    <div class="panel">
        <h2>GAME OVER</h2>
        <button id="btn-restart">Rejouer</button>
    </div>
</div>

<script>
    /* Le générateur remplacera ce placeholder
       par un objet JSON PlayableGameInit */
    window.FOURCH_INIT = {
  "config": {
    "width": 9,
    "height": 10,
    "wrapX": false,
    "wrapY": false,
    "gameMode": "classic",
    "growthLength": 1,
    "fruitRespawn": {
      "enabled": true,
      "onEaten": false,
      "everySeconds": 2
    },
    "gameOverOn": [
      "border"
    ]
  },
  "snakes": [
    {
      "id": "blob",
      "isPlayerControlled": true,
      "color": "#6DD66D",
      "headColor": "#478B47",
      "body": [
        {
          "x": 3,
          "y": 3
        },
        {
          "x": 3,
          "y": 2
        },
        {
          "x": 3,
          "y": 1
        }
      ]
    }
  ],
  "walls": [],
  "fruits": [
    {
      "x": 6,
      "y": 7
    }
  ]
};
</script>

<script type="module" src="assets/script.js"></script>
</body>
</html>
